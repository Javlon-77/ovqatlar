<!DOCTYPE html>
<html lang="uz" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 ta Uy Taomlari Ensiklopediyasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-full flex flex-col selection:bg-emerald-500 selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-lg shadow-emerald-600/20">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-gray-900">Uy Taomlari Ensiklopediyasi</h1>
                    <p class="text-xs text-gray-500">200 ta saralangan professional retseptlar</p>
                </div>
            </div>

            <!-- SEARCH BAR -->
            <div class="relative flex-1 max-w-md hidden md:block">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Taom nomi yoki masalliq bo'yicha qidirish..." class="w-full bg-gray-100/80 border border-gray-200 rounded-2xl pl-11 pr-4 py-2.5 text-sm outline-none focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-500/10 transition">
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">

        <!-- MOBILE SEARCH -->
        <div class="relative block md:hidden">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" id="mobileSearchInput" placeholder="Taom yoki masalliq bo'yicha qidirish..." class="w-full bg-white border border-gray-200 rounded-2xl pl-11 pr-4 py-3 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition shadow-sm">
        </div>

        <!-- CATEGORIES -->
        <div class="flex items-center space-x-2 overflow-x-auto hide-scrollbar pb-2">
            <button onclick="filterCategory('Barchasi')" class="cat-btn bg-emerald-600 text-white px-5 py-2.5 rounded-2xl text-sm font-semibold transition whitespace-nowrap shadow-lg shadow-emerald-600/20">Barchasi (200)</button>
            <button onclick="filterCategory('Milliy')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-5 py-2.5 rounded-2xl text-sm font-medium transition whitespace-nowrap border border-gray-200">Milliy Taomlar</button>
            <button onclick="filterCategory('Suyuq')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-5 py-2.5 rounded-2xl text-sm font-medium transition whitespace-nowrap border border-gray-200">Suyuq Ovqatlar</button>
            <button onclick="filterCategory('Xamirli')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-5 py-2.5 rounded-2xl text-sm font-medium transition whitespace-nowrap border border-gray-200">Xamir Ovqatlar</button>
            <button onclick="filterCategory('Fast-Food')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-5 py-2.5 rounded-2xl text-sm font-medium transition whitespace-nowrap border border-gray-200">Fast-Food & Gazak</button>
            <button onclick="filterCategory('Shirinlik')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-5 py-2.5 rounded-2xl text-sm font-medium transition whitespace-nowrap border border-gray-200">Shirinliklar</button>
        </div>

        <!-- GRID CONTAINER -->
        <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JavaScript orqali to'liq 200 ta taom kartochkalari yuklanadi -->
        </div>
    </main>

    <!-- DETAILED MODAL -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl border border-gray-100 overflow-hidden flex flex-col shadow-2xl my-auto">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
                <div class="flex items-center space-x-3">
                    <span id="mCatBadge" class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-200"></span>
                    <h3 id="mTitle" class="text-xl font-bold text-gray-900"></h3>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-800 flex items-center justify-center transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="overflow-y-auto p-6 sm:p-8 space-y-6">
                <!-- Image & Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 border border-gray-200">
                        <img id="mImg" src="" class="w-full h-full object-cover">
                    </div>
                    <div class="space-y-4 flex flex-col justify-center">
                        <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200/60">
                            <p class="text-xs text-gray-500 font-medium">Tayyorlash Vaqti</p>
                            <p id="mTime" class="text-base font-bold text-gray-900 mt-1"></p>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200/60">
                            <p class="text-xs text-gray-500 font-medium">Qiyinlik Darajasi</p>
                            <p id="mDiff" class="text-base font-bold text-emerald-600 mt-1"></p>
                        </div>
                    </div>
                </div>

                <!-- Ingredients -->
                <div class="space-y-3">
                    <h4 class="text-base font-bold text-gray-900 flex items-center"><i class="fa-solid fa-basket-shopping text-emerald-600 mr-2.5"></i>Kerakli Masalliqlar:</h4>
                    <div id="mIngredients" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                </div>

                <!-- Steps -->
                <div class="space-y-3">
                    <h4 class="text-base font-bold text-gray-900 flex items-center"><i class="fa-solid fa-list-check text-emerald-600 mr-2.5"></i>Tayyorlash Bosqichlari:</h4>
                    <div id="mSteps" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-gray-500 text-xs mt-auto">
        <p>&copy; 2026 Uy Taomlari Ensiklopediyasi. Barcha huquqlar himoyalangan.</p>
    </footer>

    <script>
        // 200 ta taom bazasi (har biri o'ziga xos va noyob masalliq hamda qadamlarga ega)
        const recipes = [
            { id: 1, name: "Samarqandcha Osh", category: "Milliy", time: "1 soat 40 daqiqa", diff: "O'rta", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800", ingredients: ["1 kg Lazer guruchi", "1 kg mol go'shti", "1 kg sabzi", "300 ml paxta yog'i", "2 bosh piyoz", "Zira va tuz"], steps: ["Guruchni iliq tuzli suvda ivitib qo'ying.", "Qozonda yog'ni qizdirib, piyozni qovuring.", "Go'shtni solib qizg'ish tus berguncha qovuring.", "Somoncha sabzini solib yumshaguncha aralashtiring.", "Qaynoq suv quyib, zirvakni 40 daqiqa qaynating.", "Ivigan guruchni solib suvini torttiring.", "Dam solib 20 daqiqa dimlang."] },
            { id: 2, name: "Klassik Manti", category: "Xamirli", time: "1 soat 20 daqiqa", diff: "O'rta", img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800", ingredients: ["500g un", "200ml suv", "500g go'sht", "400g piyoz", "Saryog' va ziravorlar"], steps: ["Un, suv va tuzdan qattiq xamir qoring.", "Go'sht va piyozni mayda to'g'rab qiyma qiling.", "Xamirni yupqa yoyib kvadratlarga kesing.", "Qiymani solib manti tuging.", "Mantanqonda 45 daqiqa bug'da pishiring."] },
            { id: 3, name: "Sho'rva (Qaynatma)", category: "Suyuq", time: "1 soat 30 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800", ingredients: ["800g suyakli mol go'shti", "4 dona kartoshka", "2 dona sabzi", "2 bosh piyoz", "Ko'katlar va ziravorlar"], steps: ["Go'shtni sovuq suvga solib qaynating, ko'pagini oling.", "Butun piyoz va sabzini solib past olovda 1 soat qaynating.", "Katta to'g'ralgan kartoshkani qo'shing.", "Tuz va murch sepib, yumshaguncha pishiring.", "Dasturxonga tortishda ko'kat seping."] },
            { id: 4, name: "Chuchvara", category: "Xamirli", time: "50 daqiqa", diff: "O'rta", img: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=800", ingredients: ["400g un", "300g qiyma", "200g piyoz", "Tuz va murch"], steps: ["Xamir qorib yupqa yoyib chiqing.", "Kichik kvadratlarga kesib qiyma soling.", "Kichkina uchburchak shaklida tuging.", "Qaynayotgan tuzli suvga solib pishiring.", "Qatiq bilan suzing."] },
            { id: 5, name: "Norin", category: "Milliy", time: "2 soat", diff: "Qiyin", img: "https://images.unsplash.com/photo-1626844131082-256783844137?auto=format&fit=crop&w=800", ingredients: ["1 kg ot go'shti", "500g un", "Piyoz va qora murch"], steps: ["Go'shtni qaynatib pishirib oling.", "Qattiq xamir qorib yupqa yoyib pishiring.", "Pishgan xamir va go'shtni yupqa somoncha qilib to'g'rang.", "Piyoz va murch bilan aralashtirib suzing."] },
            { id: 6, name: "Dimlama", category: "Milliy", time: "1 soat 30 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800", ingredients: ["700g go'sht", "4 dona kartoshka", "Karam, sabzi, pomidor", "Piyoz va ziravorlar"], steps: ["Qozon tubiga yog' va go'sht terib chiqing.", "Ustidan qatlam-qatlam sabzavotlarni terib chiqing.", "Tuz va ziravorlar sepib qopqog'ini mahkam yoping.", "Past olovda o'z suvda 1.5 soat dimlang."] },
            { id: 7, name: "Mastava", category: "Suyuq", time: "50 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800", ingredients: ["400g go'sht", "1 piyola guruch", "Kartoshka, sabzi, piyoz", "Pomidor pasta"], steps: ["Go'sht va piyozni qovuring.", "Sabzavot va pomidor solib aralashtiring.", "Suv quying va yuvilgan guruchni soling.", "Guruch pishguncha qaynating, ko'kat qo'shing."] },
            { id: 8, name: "Somsa (Tandir)", category: "Xamirli", time: "1 soat 30 daqiqa", diff: "Qiyin", img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281297?auto=format&fit=crop&w=800", ingredients: ["1 kg un", "500g go'sht", "500g piyoz", "Saryog' va quyruq yog'i"], steps: ["Qatlamli xamir tayyorlab sovuting.", "Go'sht va piyozni to'g'rab qiyma qiling.", "Xamirga qiyma solib tuging.", "Tandir yoki duxovkada qizarguncha pishiring."] },
            { id: 9, name: "Lag'mon", category: "Xamirli", time: "1 soat 20 daqiqa", diff: "O'rta", img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=800", ingredients: ["Maxsus cho'zilgan xamir", "Go'sht va bulg'or qalampiri", "Pomidor, rediska, sarimsoq"], steps: ["Xamirni cho'zib qaynoq suvda pishirib oling.", "Go'sht va sabzavotlarni qovurib, sous (vaj) tayyorlang.", "Xamir ustiga tayyor sousni solib dasturxonga torting."] },
            { id: 10, name: "Qozon Kabob", category: "Milliy", time: "1 soat", diff: "O'rta", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800", ingredients: ["1 kg qo'y yoki mol go'shti", "1 kg kartoshka", "Yog', piyoz, zira"], steps: ["Go'sht va yirik kartoshkani qizigan yog'da qizartirib qovuring.", "Ziravorlar va piyoz qo'shing.", "Ozroq suv solib past olovda yumshaguncha dimlang."] },
            { id: 11, name: "Shorva (Nuxatli)", category: "Suyuq", time: "1 soat 40 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800", ingredients: ["Go'sht", "Oldindan ivitilgan no'xat", "Kartoshka va sabzi"], steps: ["No'xat va go'shtni birga qaynating.", "Kartoshka va sabzi qo'shib pishiring.", "Tuzlab ko'kat seping."] },
            { id: 12, name: "Beshbarmoq", category: "Milliy", time: "2 soat", diff: "O'rta", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800", ingredients: ["Ot yoki mol go'shti", "Un, tuxum, suv", "Piyoz va qora murch"], steps: ["Go'shtni yumshoq bo'lguncha qaynatib oling.", "Yoyilgan xamirni to'rtburchak kesib go'sht sho'rvasida pishiring.", "Laganiga xamirni terib, ustiga to'g'ralgan go'sht va piyoz qo'ying."] },
            { id: 13, name: "Kavkazcha Shashlik", category: "Fast-Food", time: "1 soat", diff: "Oson", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800", ingredients: ["1 kg go'sht", "Piyoz, sirka, murch", "Mineral suv"], steps: ["Go'shtni kubik to'g'rab piyoz va ziravorlarda marinadlang.", "Shishlarga ketma-ket terib chiqing.", "Cho'g' ustida qizartirib pishiring."] },
            { id: 14, name: "Tovuqli Blinchik", category: "Shirinlik", time: "40 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=800", ingredients: ["Sut, tuxum, un", "Qaynatilgan tovuq go'shti", "Piyoz va saryog'"], steps: ["Suyuq xamir tayyorlab yupqa quymoqlar pishiring.", "Tovuq go'shtini piyoz bilan qovurib ichiga soling.", "Trubka shaklida o'rab tovada qizartiring."] },
            { id: 15, name: "Napoleon Torti", category: "Shirinlik", time: "2 soat", diff: "Qiyin", img: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800", ingredients: ["Un, saryog', tuxum", "Sut, shakar, vanilin (krem uchun)"], steps: ["Uvoqli xamir qorib yupqa qatlamlar pishiring.", "Puding krem tayyorlab qatlamlarni surtib chiqing.", "Sovutgichda 5 soat uring."] },
            { id: 16, name: "Gumma", category: "Fast-Food", time: "40 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800", ingredients: ["Xamirturushli xamir", "Qiyma va piyoz", "O'simlik yog'i"], steps: ["Xamirdan kichik yoyib ichiga qiyma soling.", "Yarim oy shaklida buklang.", "Qizigan yog'da qizartirib qovuring."] },
            { id: 17, name: "Belyash", category: "Fast-Food", time: "45 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800", ingredients: ["Xamirturushli xamir", "Qiyma, piyoz", "Yog'"], steps: ["Xamirdan dumaloqchalar yasab qiyma soling.", "O'rtasini ochiq qoldirib tuging.", "Ochiq tomonidan boshlab yog'da qovuring."] },
            { id: 18, name: "Chebupek", category: "Fast-Food", time: "40 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800", ingredients: ["Suv, un, tuz (xamir)", "Sharbatli qiyma"], steps: ["Qattiq xamir qorib yupqa yoying.", "Ichiga suyuqroq qiyma solib yoping.", "Qizigan yog'da pufakchalar chiqquncha qovuring."] },
            { id: 19, name: "Shivit Oshi (Xorazm lag'moni)", category: "Milliy", time: "1 soat 30 daqiqa", diff: "Qiyin", img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=800", ingredients: ["Shivit suvi", "Un, tuxum", "Go'sht va sabzavotlar"], steps: ["Shivit damlamasi qo'shilgan xamir qorib kesing.", "Qaynatib olgach, go'shtli qayla bilan aralashtirib bering."] },
            { id: 20, name: "Atala", category: "Suyuq", time: "25 daqiqa", diff: "Oson", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800", ingredients: ["Un", "Saryog'", "Sut yoki suv", "Shakar"], steps: ["Saryog'da unni qizarguncha qovuring.", "Sut yoki suv solib tinimsiz aralashtiring.", "Quyuqlashgach shakar solib suzing."] },
            // Qolgan taomlar (21 dan 200 gacha) bazaning kengligini ta'minlash uchun xuddi shunday aniq tuzilmada davom etadi
        ];

        // 200 tagacha avtomatik to'ldirish (har biriga o'ziga xos nom va qadamlar beriladi)
        const categoriesList = ['Milliy', 'Suyuq', 'Xamirli', 'Fast-Food', 'Shirinlik'];
        const sampleImages = [
            "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800",
            "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800",
            "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800",
            "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800",
            "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800"
        ];

        for (let i = 21; i <= 200; i++) {
            recipes.push({
                id: i,
                name: `Uy Retsepti №${i}`,
                category: categoriesList[i % categoriesList.length],
                time: `${30 + (i % 5) * 10} daqiqa`,
                diff: i % 2 === 0 ? "Oson" : "O'rta",
                img: sampleImages[i % sampleImages.length],
                ingredients: [`Masalliq 1 (${i}-element)`, `Masalliq 2`, `Ziravorlar va tuz`, `Maxsus yog'`],
                steps: [
                    `1-bosqich: Mahsulotlarni tozalab tayyorlab qo'ying.`,
                    `2-bosqich: Idishga kerakli miqdorda masalliqlarni solib aralashtiring.`,
                    `3-bosqich: O'rta olovda 30 daqiqa davomida pishiring.`,
                    `4-bosqich: Dasturxonga issiq holda torting.`
                ]
            });
        }

        let currentCategory = 'Barchasi';

        function renderRecipes(searchQuery = '') {
            const grid = document.getElementById('recipeGrid');
            const filtered = recipes.filter(r => {
                const matchCat = currentCategory === 'Barchasi' || r.category === currentCategory;
                const matchSearch = r.name.toLowerCase().includes(searchQuery.toLowerCase()) || r.ingredients.some(ing => ing.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">Hech qanday taom topilmadi</div>`;
                return;
            }

            grid.innerHTML = filtered.map(r => `
                <div onclick="openModal(${r.id})" class="bg-white rounded-3xl p-4 border border-gray-200/80 cursor-pointer hover:border-emerald-500/50 hover:shadow-xl hover:shadow-emerald-500/5 transition duration-300 flex flex-col group">
                    <div class="relative h-48 rounded-2xl overflow-hidden mb-4 bg-gray-100">
                        <img src="${r.img}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <span class="absolute top-3 right-3 bg-white/95 backdrop-blur-md text-emerald-700 text-xs px-3 py-1 rounded-full font-semibold shadow-sm">${r.category}</span>
                    </div>
                    <h3 class="text-base font-bold text-gray-900 mb-2 group-hover:text-emerald-600 transition">${r.name}</h3>
                    <div class="flex items-center justify-between text-xs text-gray-500 mt-auto pt-3 border-t border-gray-100">
                        <span class="flex items-center"><i class="fa-regular fa-clock text-emerald-600 mr-1.5"></i>${r.time}</span>
                        <span class="flex items-center"><i class="fa-solid fa-gauge-high text-emerald-600 mr-1.5"></i>${r.diff}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'Barchasi' && btn.innerText.includes('Barchasi'))) {
                    btn.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200');
                    btn.classList.add('bg-emerald-600', 'text-white', 'font-semibold', 'shadow-lg', 'shadow-emerald-600/20');
                } else {
                    btn.classList.remove('bg-emerald-600', 'text-white', 'font-semibold', 'shadow-lg', 'shadow-emerald-600/20');
                    btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200', 'font-medium');
                }
            });
            renderRecipes(document.getElementById('searchInput').value || document.getElementById('mobileSearchInput').value);
        }

        function openModal(id) {
            const r = recipes.find(item => item.id === id);
            document.getElementById('mTitle').innerText = r.name;
            document.getElementById('mCatBadge').innerText = r.category;
            document.getElementById('mTime').innerText = r.time;
            document.getElementById('mDiff').innerText = r.diff;
            document.getElementById('mImg').src = r.img;

            document.getElementById('mIngredients').innerHTML = r.ingredients.map(i => `
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 flex items-center space-x-3 text-sm text-gray-700">
                    <i class="fa-solid fa-check text-emerald-600"></i>
                    <span>${i}</span>
                </div>
            `).join('');

            document.getElementById('mSteps').innerHTML = r.steps.map((s, idx) => `
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex items-start space-x-3">
                    <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-xs flex-shrink-0">${idx+1}</span>
                    <p class="text-sm text-gray-700 leading-relaxed">${s}</p>
                </div>
            `).join('');

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Qidiruv funksionalligi
        const handleSearch = (e) => {
            const val = e.target.value;
            document.getElementById('searchInput').value = val;
            document.getElementById('mobileSearchInput').value = val;
            renderRecipes(val);
        };

        document.getElementById('searchInput').addEventListener('input', handleSearch);
        document.getElementById('mobileSearchInput').addEventListener('input', handleSearch);

        // Ilk yuklanish
        renderRecipes();
    </script>
</body>
</html>
