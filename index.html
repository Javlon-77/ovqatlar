<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 ta Uy Taomlari Video Ensiklopediyasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col">

    <!-- NAV -->
    <nav class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-zinc-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-emerald-800 flex items-center">
                <i class="fa-solid fa-utensils mr-3"></i>200 Taom Video Retsept
            </h1>
            <div class="relative w-72">
                <input type="text" id="searchInput" placeholder="200 taom ichidan qidirish..." class="w-full bg-zinc-100 border-none rounded-full px-5 py-2.5 outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-4xl font-bold mb-2">Uy Ovqatlari Ensiklopediyasi</h2>
                <p class="text-zinc-600 text-sm">Jami <span id="totalCount" class="font-bold text-emerald-600">0</span> ta video qo'llanmali retseptlar</p>
            </div>
            <!-- Kategoriyalar -->
            <div class="flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                <button onclick="filterCategory('Barchasi')" class="cat-btn bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Barchasi</button>
                <button onclick="filterCategory('Sho\'rva')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Sho'rvalar</button>
                <button onclick="filterCategory('Asosiy')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Asosiy Taomlar</button>
                <button onclick="filterCategory('Xamir')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Xamir Ovqatlar</button>
                <button onclick="filterCategory('Salat')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Salatlar</button>
                <button onclick="filterCategory('Shirinlik')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Shirinliklar</button>
            </div>
        </div>

        <div id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JS orqali to'ldiriladi -->
        </div>
    </main>

    <!-- DETAIL MODAL -->
    <div id="recipeModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-zinc-50">
                <h2 id="mTitle" class="text-2xl font-bold text-emerald-900"></h2>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-black w-10 h-10 rounded-full bg-zinc-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="overflow-y-auto p-8 space-y-6">
                <!-- Video Container -->
                <div class="w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-lg">
                    <iframe id="mVideo" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="flex items-center space-x-4 text-sm text-zinc-600 bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                    <div><i class="fa-regular fa-clock text-emerald-600 mr-1"></i> Tayyorlash vaqti: <b id="mTime"></b></div>
                    <div>•</div>
                    <div><i class="fa-solid tag text-emerald-600 mr-1"></i> Turkumi: <b id="mCat"></b></div>
                </div>

                <div>
                    <h3 class="font-bold text-lg mb-3 text-zinc-800"><i class="fa-solid fa-basket-shopping text-emerald-600 mr-2"></i>Kerakli Masalliqlar:</h3>
                    <ul id="mIngredients" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-zinc-600"></ul>
                </div>
                
                <div>
                    <h3 class="font-bold text-lg mb-3 text-zinc-800"><i class="fa-solid fa-list-check text-emerald-600 mr-2"></i>Tayyorlanish Ketma-ketligi (1ma-1):</h3>
                    <div id="mSteps" class="space-y-3 text-sm text-zinc-700 leading-relaxed"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-zinc-200 py-6 text-center text-zinc-500 text-sm mt-auto">
        <p>&copy; 2026 200 ta Uy Taomlari Video Ensiklopediyasi</p>
    </footer>

    <script>
        // 200 ta to'liq nomlar ro'yxati
        const namesList = [
            "Qovurma sho'rva", "No'xat sho'rva", "Mastava", "Moshxorda", "Shovur", "Chuchvara sho'rva", "Kalla-pacha", "Ug'ra sho'rva", "Tovuqli sho'rva", "Shovla",
            "Qatiqli sho'rva", "Atala", "Sabzavotli pyure-sho'rva", "Shpinatli sho'rva", "Baliq sho'rva", "Borщ", "Yashil borщ", "Rassolnik", "Solyanka", "Shchi",
            "Pishloqli sho'rva", "Zamburug'li sho'rva", "Xarcho sho'rvasi", "Tomatli sho'rva", "Marjumakli sho'rva", "Makaronli sho'rva", "Ko'katli sho'rva", "Seldereyli parhez sho'rva", "Loviya sho'rva", "Chesnokli krem-sho'rva",
            "Qovoq krem-sho'rva", "Brokkolili krem-sho'rva", "Go'shtli shurpa", "Qovurma shurpa", "Piyozli fransuz sho'rvasi", "Lag'mon sho'rva", "Bulg'or qalampirli sho'rva", "Go'sht va loviyali sho'rva", "Tuxumli sho'rva", "Sarimsoqli bulon",
            "O'zbekcha osh", "Ziravorli osh", "Buxoro oshi", "Farg'ona oshi", "Qozon kabob", "Tandir kabob", "Jiz", "Dimlama", "Qovurma lag'mon", "Cho'zma lag'mon",
            "Norin", "Beshbarmoq", "Moshkichiri", "Qurtob", "Honim", "Manti", "Qovoq manti", "Ko'kat manti", "Tuxum barak", "Qovurilgan chuchvara",
            "Qovoqli xonim", "Govurma", "Jigardan qovurma", "Til va yurak qovurmasi", "Gulyash", "Bifshteks", "Kotlet", "Tefteli", "Yojiki kotletlar", "Azu",
            "Sabzavotli ragu", "Pishloqli zapekanka", "Kartoshka pyuresi bilan kotlet", "Fri kartoshka va naggetslar", "Tovuq go'shti dimlamasi", "Qanotchalar pechda", "Tovuq soni pechda", "Lula kabob", "Duxovkada shashlik", "Baqlajon dimlamasi",
            "Kabachki ikrasi", "Dolma", "Karam o'rami", "Bulg'or qalampirini to'ldirish", "Pomidor dolmasi", "Makkajo'xori pyuresi", "Makaron po-flotski", "Spagetti Bolognese", "Pasta Carbonara", "Go'shtli somsa",
            "Qovoqli somsa", "Ko'kat somsa", "Kartoshkali somsa", "Qatlama somsa", "Patir non", "Obi non", "Jizzli non", "Qatlama", "Bo'g'irsoq", "Pirojki kartoshkali",
            "Pirojki go'shtli", "Pirojki tuxum-piyozli", "Qovurma pishiriqlar", "Blinchik go'shtli", "Blinchik tvorogli", "Oladya", "Sыrniki", "Pitsa", "Xachapuri", "Qatlama pirog",
            "Vatrushka", "Sharlotka", "Keks", "Medovik torti", "Napoleon torti", "Pankeyk", "Donat", "Kruassan", "Sinabon", "Pishloqli bulochka",
            "Rigatoni pishloq bilan", "Lazanya", "Qovoqli pirog", "Jo'xori uni noni", "Lavashdan rulet", "Lavashdan chips", "Doner", "Shaurma", "Sendvich", "Gamburger bulochkasi",
            "Hot-dog", "Pishloqli tayoqchalar", "Mak n Chiz", "Qovurilgan manti", "Chuchvara pechda", "Somsaxon", "Tandir somsa uyda", "Qora non suxari", "Guruchli non", "Achchiq-chuchuk",
            "Karam salati", "Bodring va pomidor salati", "Olivye salati", "Vinegret salati", "Sezar salati", "Grecheskiy salat", "Qizil lavlagi salati", "Morkovcha", "Tig' salati", "Krab tayoqchali salat",
            "Mimosa salati", "Seledka pod shuboy", "Mayskiy salat", "Toshkent salati", "Turp salati", "Ismaloqli yengil salat", "Grechka va qo'ziqorin salati", "Iliq salat", "Qovoqchali salat", "Pishloqli gazak",
            "Pomidor va brinza gazagi", "Lavash ruletchasi", "Chips va sous", "Mayonezli sous", "Adjika", "Marinovanka", "Sabzavotli ikra", "Bulg'or salati", "Yasmiq salati", "Nok va pishloqli salat",
            "Avokado salati", "Krevetkali sezar", "Fetaksa salati", "Olma va karam salati", "Parhez salat", "Toshkent maxsus", "Ko'k piyoz salati", "Selderey salati", "Mosh salati", "Paxtali holva",
            "Oq holva", "Qora holva", "Nisholda", "Sumalak", "Chak-chak", "Pahlava", "Qandolat pechenyesi", "Olmali murabbo", "Anjir murabbosi", "Qulupnay murabbosi",
            "Malina murabbosi", "Olcha kompoti", "Uzvar", "Qora choy limon", "Ko'k choy rayhon", "Ayron", "Qatiq ichimligi", "Smuzi", "Limonad", "Maxsus uy taomi"
        ];

        let foods = [];
        
        // 200 ta taomni to'liq massivga joylash
        for (let i = 0; i < namesList.length; i++) {
            let name = namesList[i];
            let cat = "Asosiy";
            if (name.toLowerCase().includes("sho'rva") || name.toLowerCase().includes("borщ") || name.toLowerCase().includes("rassolnik") || name.toLowerCase().includes("solyanka") || name.toLowerCase().includes("shchi") || name.toLowerCase().includes("atala") || name.toLowerCase().includes("bulon")) cat = "Sho'rva";
            else if (name.toLowerCase().includes("somsa") || name.toLowerCase().includes("non") || name.toLowerCase().includes("manti") || name.toLowerCase().includes("xonim") || name.toLowerCase().includes("piroq") || name.toLowerCase().includes("blinchik") || name.toLowerCase().includes("pitsa") || name.toLowerCase().includes("lazanya") || name.toLowerCase().includes("makaron") || name.toLowerCase().includes("spagetti")) cat = "Xamir";
            else if (name.toLowerCase().includes("salat") || name.toLowerCase().includes("morkovcha") || name.toLowerCase().includes("vinegret") || name.toLowerCase().includes("olivye")) cat = "Salat";
            else if (name.toLowerCase().includes("holva") || name.toLowerCase().includes("tort") || name.toLowerCase().includes("murabbo") || name.toLowerCase().includes("kompot") || name.toLowerCase().includes("shirinlik") || name.toLowerCase().includes("chay") || name.toLowerCase().includes("limonad") || name.toLowerCase().includes("smuzi") || name.toLowerCase().includes("pech") || name.toLowerCase().includes("keks") || name.toLowerCase().includes("sharlotka")) cat = "Shirinlik";

            foods.push({
                id: i + 1,
                name: name,
                category: cat,
                time: "40 - 50 daqiqa",
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ", // O'рnak uchun universal video (o'zgartirish mumkin)
                img: `https://picsum.photos/seed/recipe${i+1}/600/400`,
                ingredients: [
                    "500 grammasosiy masalliq",
                    "2 bosh piyoz va sabzavotlar",
                    "O'simlik yog'i yoki saryog'",
                    "Tuz, murch va milliy ziravorlar ta'bga ko'ra",
                    "Yarim bog' ko'katlar"
                ],
                steps: [
                    "Barcha kerakli masalliqlar toza yuvilib, to'g'rab tayyorlanib qo'yiladi.",
                    "Qozon yoki tovaga yog' solinib qizdiriladi, piyoz va go'sht qo'shib qovuriladi.",
                    "Rejaga ko'ra suv yoki boshqa sabzavotlar solinib, past olovda dimlanadi yoki pishiriladi.",
                    "Taom tayyor bo'lgach, chiroyli bezatilib dasturxonga tortiladi."
                ]
            });
        }

        let currentCat = 'Barchasi';

        function render(filter = '') {
            const grid = document.getElementById('foodGrid');
            const filtered = foods.filter(f => {
                const matchCat = currentCat === 'Barchasi' || f.category === currentCat;
                const matchSearch = f.name.toLowerCase().includes(filter.toLowerCase());
                return matchCat && matchSearch;
            });

            document.getElementById('totalCount').innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-zinc-400">Hech qanday taom topilmadi 😕</div>`;
                return;
            }

            grid.innerHTML = filtered.map(f => `
                <div onclick="openModal(${f.id})" class="bg-white rounded-3xl p-4 shadow-sm border border-zinc-200/80 cursor-pointer hover:shadow-xl hover:border-emerald-500/50 transition duration-300 flex flex-col">
                    <div class="relative h-48 overflow-hidden rounded-2xl mb-4 bg-zinc-100">
                        <img src="${f.img}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                        <span class="absolute top-3 right-3 bg-zinc-950/70 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium backdrop-blur-sm">${f.category}</span>
                        <div class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-0 hover:opacity-100 transition">
                            <span class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-play"></i></span>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-zinc-800 mb-1">${f.name}</h3>
                    <p class="text-emerald-700 text-xs font-medium mt-auto flex items-center pt-2">
                        <i class="fa-regular fa-clock mr-1.5"></i> ${f.time}
                    </p>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'Barchasi' && btn.innerText === 'Barchasi')) {
                    btn.classList.remove('bg-zinc-200', 'text-zinc-700');
                    btn.classList.add('bg-emerald-700', 'text-white');
                } else {
                    btn.classList.remove('bg-emerald-700', 'text-white');
                    btn.classList.add('bg-zinc-200', 'text-zinc-700');
                }
            });
            render(document.getElementById('searchInput').value);
        }

        function openModal(id) {
            const f = foods.find(i => i.id === id);
            document.getElementById('mTitle').innerText = f.name;
            document.getElementById('mTime').innerText = f.time;
            document.getElementById('mCat').innerText = f.category;
            document.getElementById('mVideo').src = f.video;
            
            document.getElementById('mIngredients').innerHTML = f.ingredients.map(i => `<li class="flex items-center space-x-2"><i class="fa-solid fa-check text-emerald-600 text-xs"></i><span>${i}</span></li>`).join('');
            document.getElementById('mSteps').innerHTML = f.steps.map((s, idx) => `
                <div class="flex items-start space-x-3 bg-zinc-50 p-3.5 rounded-2xl border border-zinc-100">
                    <span class="bg-emerald-700 text-white font-bold w-6 h-6 rounded-full flex items-center justify-center text-xs flex-shrink-0 mt-0.5">${idx+1}</span>
                    <p>${s}</p>
                </div>
            `).join('');

            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
            document.getElementById('mVideo').src = ""; // Videoni yopganda to'xtatish uchun
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            render(e.target.value);
        });

        render();
    </script>
</body>
</html>
