<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Uy Taomlari Video va Asl Retseptlar Ensiklopediyasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col">

    <!-- NAV -->
    <nav class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-zinc-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-emerald-800 flex items-center">
                <i class="fa-solid fa-plate-wheat mr-3"></i>Asl Milliy Retseptlar
            </h1>
            <div class="relative w-72">
                <input type="text" id="searchInput" placeholder="Taom nomini yozing..." class="w-full bg-zinc-100 border-none rounded-full px-5 py-2.5 outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-4xl font-bold mb-2">Haqiqiy Uy Taomlari</h2>
                <p class="text-zinc-600 text-sm">Har bir taomning o'z rasmi, video qo'llanmasi va to'liq tayyorlanish bosqichlari</p>
            </div>
            <!-- Kategoriyalar -->
            <div class="flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                <button onclick="filterCategory('Barchasi')" class="cat-btn bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Barchasi</button>
                <button onclick="filterCategory('Milliy')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Milliy Taomlar</button>
                <button onclick="filterCategory('Sho\'rva')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Suyuq Ovqatlar</button>
                <button onclick="filterCategory('Xamir')" class="cat-btn bg-zinc-200 text-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">Xamir Ovqatlar</button>
            </div>
        </div>

        <div id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JS orqali aniq rasmlar bilan yuklanadi -->
        </div>
    </main>

    <!-- DETAIL MODAL -->
    <div id="recipeModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-zinc-50">
                <h2 id="mTitle" class="text-2xl font-bold text-emerald-900"></h2>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-black w-10 h-10 rounded-full bg-zinc-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="overflow-y-auto p-8 space-y-6">
                <!-- Haqiqiy Video -->
                <div class="w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-lg">
                    <iframe id="mVideo" class="w-full h-full" src="" title="Video retsept" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="flex items-center space-x-4 text-sm text-zinc-600 bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                    <div><i class="fa-regular fa-clock text-emerald-600 mr-1"></i> Vaqti: <b id="mTime"></b></div>
                    <div>•</div>
                    <div><i class="fa-solid fa-tag text-emerald-600 mr-1"></i> Turkumi: <b id="mCat"></b></div>
                </div>

                <div>
                    <h3 class="font-bold text-lg mb-3 text-zinc-800"><i class="fa-solid fa-basket-shopping text-emerald-600 mr-2"></i>Kerakli Masalliqlar:</h3>
                    <ul id="mIngredients" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-zinc-600"></ul>
                </div>
                
                <div>
                    <h3 class="font-bold text-lg mb-3 text-zinc-800"><i class="fa-solid fa-list-check text-emerald-600 mr-2"></i>To'liq Tayyorlanish Jarayoni:</h3>
                    <div id="mSteps" class="space-y-3 text-sm text-zinc-700 leading-relaxed"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-zinc-200 py-6 text-center text-zinc-500 text-sm mt-auto">
        <p>&copy; 2026 Asl Milliy Taomlar Ensiklopediyasi</p>
    </footer>

    <script>
        // Aniq rasmlar va to'liq bosqichli haqiqiy taomlar bazasi
        const recipes = [
            {
                id: 1,
                name: "O'zbekcha To'y Oshi",
                category: "Milliy",
                time: "1 soat 30 daqiqa",
                img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800",
                video: "https://www.youtube.com/embed/5v09g6_X5G0",
                ingredients: [
                    "1 kg qo'y go'shti yoki mol go'shti",
                    "1 kg Alanga yoki Lazer guruchi",
                    "1 kg qizil va sariq sabzi",
                    "300 ml paxta yog'i yoki zig'ir yog'",
                    "2 bosh yirik piyoz",
                    "2-3 bosh sarimsoq",
                    "Zira, tuz va murch ta'bga ko'ra"
                ],
                steps: [
                    "Guruch iliq tuzli suvga 30-40 daqiqa oldindan ivitib qo'yiladi.",
                    "Qozonni olovga qo'yib, yaxshilab qizdiriladi va yog' solinib oqurtiladi (qizdiriladi).",
                    "To'g'ralgan piyoz solinib, qizg'ish tus olguncha qovuriladi.",
                    "Katta to'g'ralgan go'shtlar solinib, piyoz bilan birga qarsildaguncha qovuriladi.",
                    "Sombek to'g'ralgan sabzi solinadi va sabzi yumshaguncha 10-15 daqiqa aralashtirib qovuriladi.",
                    "Qozonga qaynoq suv quyiladi, sarimsoqlar botiriladi va zira sepilib, past olovda 40 daqiqa qaynatiladi (zirvak).",
                    "Ivigan guruch solinib, suvini to'la yutguncha o'rtacha olovda qaynlatiladi.",
                    "Suvi tortilgach, guruch o'rtasiga uyib yig'iladi, usti idish bilan yopilib, 20 daqiqaga dimlanadi."
                ]
            },
            {
                id: 2,
                name: "Qozon Kabob",
                category: "Milliy",
                time: "1 soat",
                img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800",
                video: "https://www.youtube.com/embed/9_39p_W5_h4",
                ingredients: [
                    "1.5 kg suyakli qo'y go'shti (qovurg'a yoki son)",
                    "4-5 dona yirik kartoshka",
                    "2 bosh piyoz",
                    "O'simlik yog'",
                    "Zira, kashnich urug'i, tuz, murch"
                ],
                steps: [
                    "Go'shtlar yirik bo'laklarga bo'linadi, tuz va ziravorlar bilan ishqalanib marinovka qilinadi.",
                    "Kartoshkalar tozalanadi, yirik bo'lsa ikkiga bo'linadi.",
                    "Qozonga yog' solinib qizdiriladi va avval kartoshkalar solinib, qizarib pishguncha qovurib olinadi.",
                    "Olingan yog'ga marinovka qilingan go'shtlar solinib, o'rtacha olovda har tarafi qizarguncha qovuriladi.",
                    "Go'sht ustidan qovurilgan kartoshkalar va halqa qilib to'g'ralgan piyoz terib chiqiladi.",
                    "Qozon qopqog'i zich yopilib, past olovda 30-40 daqiqa o'z bug'ida dimlanadi."
                ]
            },
            {
                id: 3,
                name: "Klassik Manti",
                category: "Xamir",
                time: "1 soat 20 daqiqa",
                img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800",
                video: "https://www.youtube.com/embed/8b5Tj4M5v2s",
                ingredients: [
                    "500g un, 1 ta tuxum, bir chimdim tuz va suv (xamir uchun)",
                    "600g qiymalangan go'sht yoki mayda to'g'ralgan go'sht",
                    "400g piyoz",
                    "100g dumba yog'i",
                    "Tuz, zira va murch"
                ],
                steps: [
                    "Un, tuxum, tuz va iliq suv yordamida qattiqroq xamir qoriladi va 20 daqiqa tindiriladi.",
                    "Go'sht va piyoz mayda kubik qilib to'g'raladi (piyoz qancha ko'p bo'lsa, manti shuncha shirali bo'ladi).",
                    "Qiyimaga tuz, murch va zira qo'shilib yaxshilab aralashtiriladi.",
                    "Xamir yupqa yoyilib, 10x10 sm kattaklikdagi kvadratlarga kesib chiqiladi.",
                    "Har bir kvadrat markaziga qiyma va bir bo'lak dumba qo'yilib, uchlari o'zaro mahkam birlashtirilib tugiladi.",
                    "Mantovarka qatlamlariga yog' surtilib, mantilar teriladi va qaynayotgan suv bug'ida 40-45 daqiqa pishiriladi."
                ]
            },
            {
                id: 4,
                name: "Mastava (Suyuq Osh)",
                category: "Sho'rva",
                time: "50 daqiqa",
                img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800",
                video: "https://www.youtube.com/embed/5U2G1W_6d7Q",
                ingredients: [
                    "400g go'sht",
                    "1 piyola guruch",
                    "3 ta kartoshka",
                    "2 ta sabzi va 2 bosh piyoz",
                    "2 ta pomidor yoki 2 qoshiq tomat pasta",
                    "Ko'katlar va ziravorlar"
                ],
                steps: [
                    "Go'sht va sabzavotlar kichik kubik shaklida to'g'raladi.",
                    "Qozonda yog' qizdirilib, dastlab go'sht qovuriladi, ketidan piyoz qo'shiladi.",
                    "To'g'ralgan sabzi va pomidor solinib, birgalikda qovurib olinadi.",
                    "Ustidan qaynoq suv quyiladi va qaynashga tushgach, tozalangan kartoshka solinadi.",
                    "Yaxshilab yuvilgan guruch solinib, o'rtacha olovda guruch va sabzavotlar yumshaguncha qaynlatiladi.",
                    "Tayyor mastava idishlarga quyilib, yuziga ko'katlar va qatiq solib dasturxonga tortiladi."
                ]
            }
        ];

        function render(filter = '') {
            const grid = document.getElementById('foodGrid');
            const filtered = recipes.filter(f => {
                const matchCat = currentCat === 'Barchasi' || f.category === currentCat;
                const matchSearch = f.name.toLowerCase().includes(filter.toLowerCase());
                return matchCat && matchSearch;
            });

            document.getElementById('foodGrid').innerHTML = filtered.map(f => `
                <div onclick="openModal(${f.id})" class="bg-white rounded-3xl p-4 shadow-sm border border-zinc-200/80 cursor-pointer hover:shadow-xl hover:border-emerald-500/50 transition duration-300 flex flex-col">
                    <div class="relative h-48 overflow-hidden rounded-2xl mb-4 bg-zinc-100">
                        <img src="${f.img}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                        <span class="absolute top-3 right-3 bg-zinc-950/70 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium backdrop-blur-sm">${f.category}</span>
                        <div class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-0 hover:opacity-100 transition">
                            <span class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-play"></i></span>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-zinc-800 mb-1">${f.name}</h3>
                    <p class="text-emerald-700 text-xs font-medium mt-auto flex items-center pt-2">
                        <i class="fa-regular fa-clock mr-1.5"></i> ${f.time}
                    </p>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'Barchasi' && btn.innerText === 'Barchasi')) {
                    btn.classList.remove('bg-zinc-200', 'text-zinc-700');
                    btn.classList.add('bg-emerald-700', 'text-white');
                } else {
                    btn.classList.remove('bg-emerald-700', 'text-white');
                    btn.classList.add('bg-zinc-200', 'text-zinc-700');
                }
            });
            render(document.getElementById('searchInput').value);
        }

        let currentCat = 'Barchasi';

        function openModal(id) {
            const f = recipes.find(i => i.id === id);
            document.getElementById('mTitle').innerText = f.name;
            document.getElementById('mTime').innerText = f.time;
            document.getElementById('mCat').innerText = f.category;
            document.getElementById('mVideo').src = f.video;
            
            document.getElementById('mIngredients').innerHTML = f.ingredients.map(i => `<li class="flex items-center space-x-2"><i class="fa-solid fa-check text-emerald-600 text-xs"></i><span>${i}</span></li>`).join('');
            document.getElementById('mSteps').innerHTML = f.steps.map((s, idx) => `
                <div class="flex items-start space-x-3 bg-zinc-50 p-3.5 rounded-2xl border border-zinc-100">
                    <span class="bg-emerald-700 text-white font-bold w-6 h-6 rounded-full flex items-center justify-center text-xs flex-shrink-0 mt-0.5">${idx+1}</span>
                    <p>${s}</p>
                </div>
            `).join('');

            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
            document.getElementById('mVideo').src = "";
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            render(e.target.value);
        });

        render();
    </script>
</body>
</html>
