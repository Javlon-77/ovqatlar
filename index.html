<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uy Retseptlari Akademiyasi - 200+ Taomlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-950 min-h-screen flex flex-col">

    <!-- NAV -->
    <nav class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-zinc-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-700 text-white p-2.5 rounded-2xl shadow-md">
                    <i class="fa-solid fa-bowl-food text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-emerald-900 tracking-wide">200+ Uy Retseptlari</h1>
            </div>
            <div class="relative w-72 sm:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-400"></i>
                <input type="text" id="searchInput" placeholder="200+ taom ichidan qidirish..." class="w-full bg-zinc-100 border-none rounded-full pl-11 pr-5 py-3 outline-none focus:ring-2 focus:ring-emerald-600 text-sm transition">
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
        <div class="mb-10 text-center sm:text-left">
            <h2 class="text-4xl font-extrabold mb-3 text-zinc-900">Oila uchun eng saralangan taomlar</h2>
            <p class="text-zinc-600">Uy sharoitida osongina tayyorlanadigan milliy va osiyochi taomlar to'plami.</p>
        </div>

        <div id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JS orqali to'ldiriladi -->
        </div>
    </main>

    <!-- DETAIL MODAL -->
    <div id="recipeModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-zinc-50">
                <h2 id="mTitle" class="text-2xl font-bold text-emerald-900"></h2>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-900 w-10 h-10 rounded-full flex items-center justify-center bg-white shadow-sm border border-zinc-200 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="overflow-y-auto p-8 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    <div id="mMedia" class="rounded-2xl overflow-hidden shadow-lg h-64 md:h-80"></div>
                    <div>
                        <div class="mb-4 inline-block bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-full">
                            <i class="fa-regular fa-clock mr-1"></i> <span id="mTime"></span>
                        </div>
                        <h3 class="font-bold text-lg mb-3 text-zinc-900 flex items-center space-x-2">
                            <i class="fa-solid fa-basket-shopping text-emerald-700"></i>
                            <span>Kerakli Masalliqlar:</span>
                        </h3>
                        <ul id="mIngredients" class="text-sm text-zinc-600 space-y-2 pl-4 list-disc"></ul>
                    </div>
                </div>
                <div>
                    <h3 class="font-bold text-xl mb-4 text-zinc-900 flex items-center space-x-2 border-t pt-6 border-zinc-100">
                        <i class="fa-solid fa-list-check text-emerald-700"></i>
                        <span>Tayyorlanish Jarayoni (1ma-1):</span>
                    </h3>
                    <div id="mSteps" class="space-y-4 text-sm text-zinc-700 leading-relaxed"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-zinc-200 py-6 text-center text-zinc-500 text-sm">
        <p>&copy; 2026 Uy Retseptlari Akademiyasi. Barcha huquqlar himoyalangan.</p>
    </footer>

    <script>
        // KENGAYTIRILGAN BAZA (Siz bu yerga xohlagancha 200+ taomni qo'shib ketaverasiz)
        const foods = [
            {
                id: 1, name: "Qozon Kabob", time: "60 daqiqa", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800",
                ingredients: ["1 kg mol go'shti", "1 kg kartoshka", "100 ml o'simlik yog'i", "Ziravorlar (tuz, murch, zira)", "1 bosh piyoz"],
                steps: [
                    "Go'shtni yirik bo'laklarga to'g'rab, tuz va murch bilan aralashtiring.",
                    "Qozonni yaxshilab qizdirib, yog' quying va go'shtni qizarguncha qovuring.",
                    "Tozalangan butun yoki yarmiga bo'lingan kartoshkalarni soling.",
                    "Past olovda qopqog'ini yopib, 40 daqiqa dimlab pishiring."
                ]
            },
            {
                id: 2, name: "Mastava (Guruchli Sho'rva)", time: "45 daqiqa", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800",
                ingredients: ["500g go'sht", "100g guruch", "2 ta sabzi", "2 ta piyoz", "2 ta pomidor", "Ko'katlar va ziravorlar"],
                steps: [
                    "Go'sht va piyozni mayda to'g'rab qozonda qovuring.",
                    "Ustidan pomidor va sabzini solib birga qovurishni davom ettiring.",
                    "Suv quyib qaynating, so'ng yuvilgan guruchni soling.",
                    "Guruch pishgach, ko'katlar sepib dasturxonga torting."
                ]
            },
            {
                id: 3, name: "Norin", time: "120 daqiqa", img: "https://images.unsplash.com/photo-1599487488170-d11ec9c1753c?auto=format&fit=crop&w=800",
                ingredients: ["1 kg qo'y yoki mol go'shti", "500g un", "1 ta tuxum", "Piyoz va qazi", "Murch va tuz"],
                steps: [
                    "Un, tuxum, suv va tuzdan qattiq xamir qorib, yupqa yoying va tasmalar shaklida kesib qaynoq suvda pishirib oling.",
                    "Go'shtni alohida yumshoq bo'lguncha qaynatib oling.",
                    "Pishgan xamirni yog'lab, ingichka somoncha qilib to'g'rang.",
                    "Go'shtni mayda to'g'rab, xamir va piyoz bilan birga aralashtirib suzib bering."
                ]
            },
            {
                id: 4, name: "Manti", time: "90 daqiqa", img: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=800",
                ingredients: ["500g un", "700g go'sht", "600g piyoz", "Saryog' va ziravorlar"],
                steps: [
                    "Un, suv va tuzdan yumshoq xamir qorib dam bering.",
                    "Go'sht va piyozni mayda kubik qilib to'g'rab, tuz va ziravorlar qo'shing.",
                    "Xamirni yupqa yoyib, to'rtburchaklar kesing va qiyma solib tuging.",
                    "Mantiqovurga terib, bug'da 40-45 daqiqa pishiring."
                ]
            },
            {
                id: 5, name: "Norincha (Tovuqli Sho'rva)", time: "40 daqiqa", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800",
                ingredients: ["Tovuq go'shti", "Kartoshka", "Sabzi", "Piyoz", "Vermishel"],
                steps: [
                    "Tovuq go'shtini suvga solib qaynating, ko'pagini olib tashlang.",
                    "To'g'ralgan sabzi va kartoshkani soling.",
                    "Sabzavotlar yumshagach, vermishel va ziravorlar qo'shing.",
                    "Tayyor bo'lgach ko'katlar bilan bezang."
                ]
            },
            {
                id: 6, name: "Dimlama", time: "80 daqiqa", img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800",
                ingredients: ["700g go'sht", "Karam", "Kartoshka", "Sabzi, piyoz, pomidor, bulg'or qalampiri"],
                steps: [
                    "Qozon tubiga yog' va yirik to'g'ralgan go'shtni terib chiqing.",
                    "Ustma-ust qatlam qilib piyoz, sabzi, pomidor, kartoshka va karam yaproqlarini qo'ying.",
                    "Har bir qatnamga tuz va ziravorlar sepib chiqing.",
                    "Qopqog'ini mahkam yopib, past olovda 1.5 soat davomida o'z suvda dimlang."
                ]
            },
            {
                id: 7, name: "Somsa (Tandir/Pech)", time: "90 daqiqa", img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?auto=format&fit=crop&w=800",
                ingredients: ["Pech xamiri yoki qavatli xamir", "500g go'sht", "500g piyoz", "Zira va dumba yog'i"],
                steps: [
                    "Go'sht va piyozni mayda to'g'rab, dumba yog'i va ziravorlar qo'shib aralashtiring.",
                    "Xamirni bo'laklarga bo'lib, yoying va o'rtasiga qiyma qo'ying.",
                    "Uchburchak yoki aylana shaklida tugib, ustiga tuxum surting va kunjut seping.",
                    "200 darajali pechda 35-40 daqiqa davomida qizarguncha pishiring."
                ]
            },
            {
                id: 8, name: "Honim", time: "50 daqiqa", img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=800",
                ingredients: ["Xamir uchun un va suv", "Qiyma yoki kartoshkali ichlik", "Piyoz va saryog'"],
                steps: [
                    "Xamirni yupqa qilib yoying.",
                    "Ustiga qiymalik yoki mayda to'g'ralgan kartoshkali masalliqni tekis taqsimlang.",
                    "Rulo shaklida o'rab, mantovur qismiga qo'ying va bug'da 40 daqiqa pishiring.",
                    "Kesib, saryog' yoki sous bilan dasturxonga torting."
                ]
            }
            // Izoh: Siz shu yerga vergul qo'yib 9, 10, ... 200+ taomlarni xuddi shunday formatda qo'shib ketaverasiz!
        ];

        function render(filter = '') {
            const grid = document.getElementById('foodGrid');
            const filtered = foods.filter(f => f.name.toLowerCase().includes(filter.toLowerCase()));
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-zinc-400">Hech qanday taom topilmadi 😕</div>`;
                return;
            }

            grid.innerHTML = filtered.map(f => `
                <div onclick="openModal(${f.id})" class="bg-white rounded-3xl p-4 shadow-sm border border-zinc-200/80 cursor-pointer hover:shadow-xl transition flex flex-col group">
                    <div class="h-48 rounded-2xl overflow-hidden mb-4 relative">
                        <img src="${f.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    </div>
                    <h3 class="text-lg font-bold mb-2 text-zinc-900 group-hover:text-emerald-800 transition">${f.name}</h3>
                    <p class="text-emerald-700 text-xs font-semibold mt-auto"><i class="fa-regular fa-clock mr-1"></i> ${f.time}</p>
                </div>
            `).join('');
        }

        function openModal(id) {
            const f = foods.find(i => i.id === id);
            document.getElementById('mTitle').innerText = f.name;
            document.getElementById('mTime').innerText = f.time;
            document.getElementById('mMedia').innerHTML = `<img src="${f.img}" class="w-full h-full object-cover">`;
            document.getElementById('mIngredients').innerHTML = f.ingredients.map(i => `<li>${i}</li>`).join('');
            document.getElementById('mSteps').innerHTML = f.steps.map((s, idx) => `
                <div class="flex items-start space-x-3 bg-zinc-50 p-3.5 rounded-2xl border border-zinc-200/60">
                    <span class="bg-emerald-700 text-white font-bold w-6 h-6 rounded-full flex items-center justify-center text-xs flex-shrink-0 mt-0.5">${idx + 1}</span>
                    <p class="text-zinc-700">${s}</p>
                </div>
            `).join('');
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function closeModal() { 
            document.getElementById('recipeModal').classList.add('hidden'); 
        }

        document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
